[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mapes-agent-persona-eval"
version = "0.1.0"
description = "Multi-Agent Persona Evaluation System MVP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "requests>=2.31.0",
  "jsonschema>=4.22.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
ocr = ["paddleocr>=2.7.0"]

[project.scripts]
mapes = "mapes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
